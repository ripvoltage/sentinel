[package]
name = "sentinel-daemon"
version = "0.1.0"
edition = "2021"
description = "Userspace daemon for behavioral ransomware detection on GNU/Linux"

[[bin]]
name = "ransomware-daemon"
path = "src/main.rs"

[dependencies]
# ── Shared types ───────────────────────────────────────────────────────────
ebpf-common = { path = "../ebpf-common", package = "sentinel-common", features = ["user"] }

# ── eBPF loader & runtime ─────────────────────────────────────────────────
aya       = "0.14"
aya-log   = "0.2"

# ── Async runtime ─────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Observability / logging ────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender   = "0.2"
log                = "0.4"           # bridge for aya-log

# ── Time ───────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── System / POSIX ─────────────────────────────────────────────────────────
nix  = { version = ">=0.27, <0.30", features = ["signal", "process"] }
libc = "0.2"

# ── Serialisation ──────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Desktop notifications ─────────────────────────────────────────────────
notify-rust = "4"
zbus        = { version = ">=3, <5", default-features = false, features = ["tokio"] }

# ── Error handling ─────────────────────────────────────────────────────────
anyhow = "1"
